plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    // EMI is not on the NeoForge maven, and its own maven redirects to a host
    // that times out here. exclusiveContent keeps that lookup off the NeoForge maven.
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered gametest, then exits. The server crashes when there are none.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Xmx2g'
            jvmArgument '-XX:+UseSerialGC'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// Runtime-only dependencies that dependents of this mod do not inherit.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def gtSdk = files('libs/gt6ce/gregtech6-addon-sdk-1.21.1-neoforge-0.7.0.jar')
def gtMod = files('libs/gt6ce/gregtech6-1.21.1-neoforge.jar')

dependencies {
    // Recipe viewer and block overlay for runClient only. localRuntime keeps them out of the published jar.
    localRuntime "maven.modrinth:emi:${emi_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    // ProjectRed and its libraries, fetched by fetch-projectred.ps1. Absent jars are simply left out.
    // The api jar is compileOnly only. Leaving it on the runtime classpath would load a second
    // copy of IBundledTile and bundled cables would not recognise this mod's block entities.
    localRuntime fileTree(dir: 'libs/projectred', include: '*.jar', exclude: '*-api.jar')
    compileOnly files('libs/projectred/mrtjp.ProjectRed-1.21.1-4.23.0-api.jar')

    // The SDK is the only GregTech compile dependency, so internals stay invisible.
    // The full mod jar is the dev and test runtime. Neither jar is packaged into this one.
    compileOnly gtSdk
    localRuntime gtMod
    testCompileOnly gtSdk
    testRuntimeOnly gtMod
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

configurations.named('testCompileClasspath') {
    extendsFrom(configurations.modDevCompileDependencies)
}
configurations.named('testRuntimeClasspath') {
    extendsFrom(configurations.modDevRuntimeDependencies)
}

// Expands ${} properties from gradle.properties into the mod metadata.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
